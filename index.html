<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Primary Meta Tags -->
    <title>Digital Ledger - Management System</title>
    <meta name="title" content="Digital Ledger - Management System">
    <meta name="description" content="Secure digital ledger for Gold & Silver loans. Manage collateral and calculate interest automatically.">
    
    <!-- Vercel/PWA Metadata -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#EAB308">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2696/2696191.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            overscroll-behavior-y: auto;
            user-select: auto;
        }
        input, textarea {
            user-select: auto;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Optimized transitions for Vercel hosting */
        .page-transition {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="splash-screen" style="position: fixed; inset: 0; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease-out;">
        <div style="width: 80px; height: 80px; background: #EAB308; border-radius: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 25px -5px rgba(234, 179, 8, 0.2); margin-bottom: 24px; animation: pulse 2s infinite;">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <h1 style="font-family: 'Inter', sans-serif; font-weight: 900; color: #1e293b; font-size: 20px; letter-spacing: -0.025em; margin: 0;">DIGITAL LEDGER</h1>
        <p style="font-family: 'Inter', sans-serif; font-weight: 600; color: #64748b; font-size: 12px; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.1em;">Management System</p>
        
        <div style="position: absolute; bottom: 48px; width: 120px; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden;">
            <div style="width: 40%; height: 100%; background: #EAB308; border-radius: 2px; animation: loading 1.5s infinite ease-in-out;"></div>
        </div>
    </div>

    <style>
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
    </style>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        function hideSplashScreen() {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => {
                    if (splash.parentNode) {
                        splash.remove();
                    }
                }, 500);
            }
        }
        // Failsafe dismiss: Guarantee the splash screen goes away within 1.5 seconds max
        // even if page assets are blocked or some scripts fail to load in WebViews.
        window.addEventListener('load', hideSplashScreen);
        setTimeout(hideSplashScreen, 1500);
    </script>
</body>
</html>
